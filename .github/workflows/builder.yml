name: FEXBash Builder

on:
    workflow_dispatch:
        inputs:
            runner:
                description: "Runner type"
                type: choice
                default: "self-hosted-arm64"
                options:
                    - "self-hosted-arm64"
                    - "ubuntu-latest"
            base_image:
                description: "Base image"
                type: choice
                default: "ubuntu"
                options:
                    - "ubuntu"
                    - "fedora"
            build_scope:
                description: "Build scope"
                type: choice
                default: "latest-only"
                options:
                    - "latest-only"
                    - "ubuntu-all"
                    - "fedora-all"
                    - "full-matrix"
            version:
                description: "FEX version"
                type: string
                default: "latest"
            force_rebuild:
                description: "Force rebuild and re-release even if image exists"
                type: boolean
                default: false
            verify_build:
                description: "Verify build"
                type: boolean
                default: false

permissions:
    contents: write
    packages: write
    actions: read

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    LLVM_VERSION: "18"
    DOCKER_BUILDKIT: 1
    CACHE_VERSION: v3
    DOCKERHUB_REPO: supersunho/fex-emu

concurrency:
    group: ${{ github.workflow }}-${{ github.event.inputs.build_scope || 'latest-only' }}-${{ github.event.inputs.version || 'latest' }}
    cancel-in-progress: true

jobs:
    prepare-matrix:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.generate-matrix.outputs.matrix }}
            has-builds: ${{ steps.generate-matrix.outputs.has-builds }}
            build_date: ${{ steps.set-build-date.outputs.build_date }}
        steps:
            - name: Set build date
              id: set-build-date
              run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

            - name: Generate build matrix
              id: generate-matrix
              run: |
                  ROOTFS_DATA=$(curl -s https://rootfs.fex-emu.gg/RootFS_links.json)
                  BUILD_SCOPE="${{ github.event.inputs.build_scope || 'latest-only' }}"
                  BASE_IMAGE_INPUT="${{ github.event.inputs.base_image || 'ubuntu' }}"

                  case "$BUILD_SCOPE" in
                    "latest-only")
                      UBUNTU_ENTRY=$(echo "$ROOTFS_DATA" | jq -r '.v1 | to_entries[] | select(.value.DistroMatch == "ubuntu" and .value.Type == "squashfs")' | jq -s 'sort_by(.value.DistroVersion | gsub("[^0-9.]"; "") | split(".") | map(tonumber)) | last')
                      FEDORA_ENTRY=$(echo "$ROOTFS_DATA" | jq -r '.v1 | to_entries[] | select(.value.DistroMatch == "fedora" and .value.Type == "squashfs")' | jq -s 'sort_by(.value.DistroVersion | tonumber) | last')
                      
                      # Map OS to Dockerfile name
                      os_to_df() {
                        case "$1" in
                          ubuntu) echo "ubuntu" ;;
                          fedora) echo "fedora" ;;
                          *) echo "" ;;
                        esac
                      }
                      add_matrix_entry() {
                        local entry="$1"
                        local os=$(echo "$entry" | jq -r '.value.DistroMatch')
                        local df=$(os_to_df "$os")
                        echo "$entry" | jq -c --arg df "$df" '{os: .value.DistroMatch, version: .value.DistroVersion, url: .value.URL, hash: .value.Hash, type: .value.Type, dockerfile: $df}'
                      }
                      
                      MATRIX_JSON="{\"include\": ["
                      NEED_COMMA=false
                      if [ -n "$UBUNTU_ENTRY" ] && { [ "$BASE_IMAGE_INPUT" = "ubuntu" ] || [ "$BASE_IMAGE_INPUT" = "all" ]; }; then
                        MATRIX_JSON="${MATRIX_JSON}$(add_matrix_entry "$UBUNTU_ENTRY")"
                        NEED_COMMA=true
                      fi
                      if [ -n "$FEDORA_ENTRY" ] && { [ "$BASE_IMAGE_INPUT" = "fedora" ] || [ "$BASE_IMAGE_INPUT" = "all" ]; }; then
                        [ "$NEED_COMMA" = true ] && MATRIX_JSON="${MATRIX_JSON},"
                        MATRIX_JSON="${MATRIX_JSON}$(add_matrix_entry "$FEDORA_ENTRY")"
                      fi
                      MATRIX_JSON="${MATRIX_JSON}]}"
                      ;;
                    "ubuntu-all")
                      UBUNTU_ENTRIES=$(echo "$ROOTFS_DATA" | jq -r '.v1 | to_entries[] | select(.value.DistroMatch == "ubuntu" and .value.Type == "squashfs") | {os: .value.DistroMatch, version: .value.DistroVersion, url: .value.URL, hash: .value.Hash, type: .value.Type, dockerfile: .value.DistroMatch}' | jq -cs '{"include": .}')
                      MATRIX_JSON="$UBUNTU_ENTRIES"
                      ;;
                    "fedora-all")
                      FEDORA_ENTRIES=$(echo "$ROOTFS_DATA" | jq -r '.v1 | to_entries[] | select(.value.DistroMatch == "fedora" and .value.Type == "squashfs") | {os: .value.DistroMatch, version: .value.DistroVersion, url: .value.URL, hash: .value.Hash, type: .value.Type, dockerfile: .value.DistroMatch}' | jq -cs '{"include": .}')
                      MATRIX_JSON="$FEDORA_ENTRIES"
                      ;;
                    "full-matrix")
                      ALL_ENTRIES=$(echo "$ROOTFS_DATA" | jq -r '.v1 | to_entries[] | select(.value.Type == "squashfs" and (.value.DistroMatch == "ubuntu" or .value.DistroMatch == "fedora")) | {os: .value.DistroMatch, version: .value.DistroVersion, url: .value.URL, hash: .value.Hash, type: .value.Type, dockerfile: .value.DistroMatch}' | jq -cs '{"include": .}')
                      MATRIX_JSON="$ALL_ENTRIES"
                      ;;
                  esac

                  echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
                  HAS_BUILDS=$(echo "$MATRIX_JSON" | jq -e '.include | length > 0' 2>/dev/null || echo "false")
                  echo "has-builds=$HAS_BUILDS" >> $GITHUB_OUTPUT

    build:
        needs: prepare-matrix
        if: needs.prepare-matrix.outputs.has-builds == 'true'
        runs-on: ${{ github.event.inputs.runner || 'self-hosted-arm64' }}
        strategy:
            matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
            fail-fast: false
            max-parallel: 2
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Check existing image
              id: check-image
              run: |
                  VERSION="${{ github.event.inputs.version || 'latest' }}"
                  FEX_VERSION=${VERSION#FEX-}
                  FEX_VERSION=${FEX_VERSION#v}
                  [ "$FEX_VERSION" = "latest" ] && FEX_VERSION="latest"

                  RELEASE_TAG="${{ matrix.os }}-${{ matrix.version }}-${FEX_VERSION}"

                  # GHCR 및 Docker Hub 존재 여부 확인
                  EXISTS=false
                  # latest 태그는 항상 재빌드 (버전 릴리스와 관계없이 최신 유지)
                  if [ "${FEX_VERSION}" != "latest" ]; then
                    docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${RELEASE_TAG} >/dev/null 2>&1 && EXISTS=true
                    docker manifest inspect ${{ env.DOCKERHUB_REPO }}:${RELEASE_TAG} >/dev/null 2>&1 && EXISTS=true
                  fi

                  echo "exists=$EXISTS" >> $GITHUB_OUTPUT
                  echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
                  echo "fex_version=$FEX_VERSION" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              id: setup-buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver: docker-container
                  driver-opts: image=moby/buildkit:master,network=host

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push (Release)
              # 이미지가 없거나, 강제 재빌드 옵션이 켜져 있을 때 실행
              if: steps.check-image.outputs.exists == 'false' || github.event.inputs.force_rebuild == 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile.${{ matrix.dockerfile }}
                  platforms: linux/arm64
                  push: true
                  # 강제 재빌드 시 캐시를 사용하지 않고 새로 빌드하여 릴리즈 보장
                  no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.check-image.outputs.release_tag }}
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.os }}-${{ matrix.version }}
                      ${{ env.DOCKERHUB_REPO }}:${{ steps.check-image.outputs.release_tag }}
                      ${{ env.DOCKERHUB_REPO }}:${{ matrix.os }}-${{ matrix.version }}
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                      ${{ env.DOCKERHUB_REPO }}:latest
                  cache-from: type=gha,scope=${{ env.CACHE_VERSION }}-${{ github.event.inputs.base_image }}
                  cache-to: type=gha,mode=max,scope=${{ env.CACHE_VERSION }}-${{ github.event.inputs.base_image }}
                  build-args: |
                      TARGETPLATFORM=linux/arm64
                      BUILD_DATE=${{ needs.prepare-matrix.outputs.build_date || 'unknown' }}
                      BASE_IMAGE=${{ matrix.os == 'ubuntu' && 'ubuntu:24.04' || 'fedora:40' }}
                      ROOTFS_OS=${{ matrix.os }}
                      ROOTFS_VERSION=${{ matrix.version }}
                      ROOTFS_URL=${{ matrix.url }}
                      LLVM_VERSION=${{ env.LLVM_VERSION }}
                      FEX_VERSION=${{ steps.check-image.outputs.fex_version }}

    verify:
        needs: build
        # 빌드가 성공했거나, 이미 이미지가 있어서 skip된 경우에도 검증을 원하면 condition 수정 가능
        if: github.event.inputs.verify_build == 'true'
        runs-on: ${{ github.event.inputs.runner || 'self-hosted-arm64' }}
        strategy:
            matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
        steps:
            - name: Verify image
              run: |
                  VERSION="${{ github.event.inputs.version || 'latest' }}"
                  FEX_VERSION=${VERSION#FEX-}
                  FEX_VERSION=${FEX_VERSION#v}
                  [ "$FEX_VERSION" = "latest" ] && FEX_VERSION="latest"
                  RELEASE_TAG="${{ matrix.os }}-${{ matrix.version }}-${FEX_VERSION}"

                  docker pull ${{ env.DOCKERHUB_REPO }}:$RELEASE_TAG
                  docker run --rm --platform linux/arm64 ${{ env.DOCKERHUB_REPO }}:$RELEASE_TAG FEXBash -c "echo 'FEX verification successful for $RELEASE_TAG'"

    release:
        needs: [prepare-matrix, build]
        if: always() && needs.prepare-matrix.outputs.has-builds == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: 🕐 Set build timestamp
              id: release-tag
              run: |
                  VERSION="${{ github.event.inputs.version || 'latest' }}"
                  FEX_VERSION=${VERSION#FEX-}
                  FEX_VERSION=${FEX_VERSION#v}
                  [ "$FEX_VERSION" = "latest" ] && FEX_VERSION="latest"
                  echo "fex_version=$FEX_VERSION" >> $GITHUB_OUTPUT
                  TIMESTAMP=$(date -u +'%Y%m%dT%H%M%S')
                  echo "release_tag=${FEX_VERSION}-build-${TIMESTAMP}" >> $GITHUB_OUTPUT
                  echo "build_date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

            - name: Create comprehensive GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.release-tag.outputs.release_tag }}
                  name: "FEXBash Build ${{ steps.release-tag.outputs.fex_version }} (Build #${{ github.run_number }})"
                  body: |
                      # 🚀 FEXBash ARM64 Container Release ${{ steps.release-tag.outputs.fex_version }}

                      **Build Date**: ${{ steps.release-tag.outputs.build_date }}
                      **FEX Version**: ${{ steps.release-tag.outputs.fex_version }}
                      **Build Scope**: ${{ github.event.inputs.build_scope || 'latest-only' }}
                      **Runner**: ${{ github.event.inputs.runner || 'self-hosted-arm64' }}
                      **Force Rebuild**: ${{ github.event.inputs.force_rebuild || 'false' }}
                      **Base Architecture**: Ubuntu 24.04 LTS
                      **Architecture**: ARM64 native compilation and execution
                      **Container Registries**: GitHub Container Registry (GHCR) + Docker Hub
                      **Build Workflow**: #${{ github.run_number }}

                      ## 📦 Available Container Images

                      ### 🎯 Fast Download (Docker Hub - Recommended)
                      ```
                      # Latest release
                      docker pull ${{ env.DOCKERHUB_REPO }}:latest

                      # Version-specific build
                      docker pull ${{ env.DOCKERHUB_REPO }}:${{ steps.release-tag.outputs.fex_version }}
                      ```

                      ### 🐧 Ubuntu RootFS
                      ```
                      # All Ubuntu RootFS versions built in this run
                      # Format: ${{ env.DOCKERHUB_REPO }}:{distro}-{version}
                      # Format: ${{ env.DOCKERHUB_REPO }}:{distro}-{version}-{fex_version}
                      docker pull ${{ env.DOCKERHUB_REPO }}:${{ steps.release-tag.outputs.fex_version }}
                      ```

                      ### 🎩 Fedora RootFS
                      ```
                      # All Fedora RootFS versions built in this run
                      # See registry for complete tag list
                      ```

                      ### 🔄 Alternative Registry (GitHub Container Registry)
                      ```
                      # Latest build
                      docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                      # Distribution-specific tags: {os}-{version}
                      docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ubuntu-24.04
                      ```

                      ## 🚀 Quick Start

                      ### Interactive x86 Shell on ARM64
                      ```
                      docker run -it --rm ${{ env.DOCKERHUB_REPO }}:latest
                      ```

                      ### Execute x86 Command
                      ```
                      docker run --rm ${{ env.DOCKERHUB_REPO }}:latest \
                          FEXBash -c "uname -a"
                      ```

                      ## 🔧 Build Information

                      | Parameter | Value |
                      |-----------|-------|
                      | **FEX Version** | ${{ steps.release-tag.outputs.fex_version }} |
                      | **Build Date** | ${{ steps.release-tag.outputs.build_date }} |
                      | **Build Scope** | ${{ github.event.inputs.build_scope || 'latest-only' }} |
                      | **Runner** | ${{ github.event.inputs.runner || 'self-hosted-arm64' }} |
                      | **Force Rebuild** | ${{ github.event.inputs.force_rebuild || 'false' }} |
                      | **Workflow** | ${{ github.workflow }} |
                      | **Run ID** | ${{ github.run_id }} |
                      | **Branch** | ${{ github.ref }} |
                      | **Commit** | ${{ github.sha }} |

                      ## 🛠️ Technical Specifications

                      - **Base Image**: Ubuntu 24.04 LTS
                      - **LLVM Version**: ${{ env.LLVM_VERSION }}
                      - **Build System**: CMake + Ninja
                      - **Target Platform**: linux/arm64
                      - **Emulation Target**: x86/x86_64
                      - **RootFS**: Ubuntu and Fedora distributions

                      ---

                      **🚀 Ready to run x86 applications on ARM64?**
                      **Start with**: `docker run -it --rm ${{ env.DOCKERHUB_REPO }}:ubuntu-24.04`

                      **📖 Need help?** Check the [Repository README](https://github.com/${{ github.repository }})

                      **⭐ Enjoying FEX on Docker?** Star the repository!
                  draft: false
                  prerelease: ${{ steps.release-tag.outputs.fex_version == 'latest' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
